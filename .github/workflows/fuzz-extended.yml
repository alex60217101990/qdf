name: fuzz-extended

# Longer fuzz run on a schedule. The PR / push fuzz job in ci.yml is a
# 30 s smoke; this one runs ten minutes per target nightly.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-extended
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzDecoder_NeverPanics, FuzzRoundTrip_StringSlice]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/go-build
          key: gocache-fuzz-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/*.go') }}
          restore-keys: |
            gocache-fuzz-${{ runner.os }}-

      - name: Restore fuzz corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: testdata/fuzz/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # GOMEMLIMIT makes each fuzz worker GC under memory pressure instead of
      # being OOM-killed by the OS after cumulative RSS growth over a long run
      # (the "hung or terminated unexpectedly" failure mode — an environmental
      # OOM, not an input crash). -parallel caps worker processes so their
      # aggregate footprint stays well under the runner's RAM.
      - name: ${{ matrix.target }} (10m)
        env:
          GOMEMLIMIT: 2GiB
        run: go test -run=^$ -fuzz=${{ matrix.target }} -fuzztime=10m -timeout=15m -parallel=2

      - name: Upload new corpus on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          path: testdata/fuzz/${{ matrix.target }}
          retention-days: 14
