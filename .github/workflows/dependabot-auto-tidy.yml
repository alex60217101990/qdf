# Keeps the multi-module workspace consistent on Dependabot PRs.
#
# This repo has five Go modules; the four nested ones (bench, cmd/qdfgen,
# cmd/qdf-bench, internal/codegen_test) carry `replace ... => ../../` and import
# the root module, so they inherit the root's dependency versions. When a
# Dependabot PR bumps a shared dependency in ONE module's go.mod, the siblings
# that inherit it via the replace are left with a stale go.mod/go.sum and every
# `go build` / lint / govulncheck job there fails with
# "updates to go.mod needed; to update it: go mod tidy".
#
# Dependabot tidies only the module it opened the PR for, so it cannot fix this
# cross-module drift on its own. This workflow runs `go mod tidy` across every
# module on a Dependabot PR and commits the result back to the PR branch, so the
# PR self-heals and the normal CI jobs pass.
#
# Security: pull_request_target runs with the base repo's write token, which is
# required to push back to the PR branch (Dependabot PRs otherwise get a
# read-only token). It is gated to the Dependabot bot acting on a same-repo
# branch, and the only PR-authored input it acts on is dependency resolution —
# `go mod tidy` downloads and resolves modules but does NOT build or run any PR
# code, so untrusted code is never executed with the elevated token.
name: dependabot auto-tidy

on:
  pull_request_target:
    paths:
      - "**/go.mod"
      - "**/go.sum"

# Least-privilege default; the tidy job elevates contents to write so it can
# push the tidy commit back to the Dependabot PR branch.
permissions:
  contents: read

concurrency:
  group: dependabot-auto-tidy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tidy:
    name: go mod tidy (all modules)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Default GITHUB_TOKEN (write, via pull_request_target) so the tidy
          # commit can be pushed back to the PR branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            bench/go.sum
            cmd/qdfgen/go.sum
            cmd/qdf-bench/go.sum
            internal/codegen_test/go.sum

      - name: go mod tidy across every module
        run: |
          set -euo pipefail
          for dir in . bench cmd/qdfgen cmd/qdf-bench internal/codegen_test; do
            echo "::group::go mod tidy ($dir)"
            (cd "$dir" && go mod tidy)
            echo "::endgroup::"
          done

      - name: commit and push if drift was fixed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- '**/go.mod' '**/go.sum'; then
            echo "All modules already tidy — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '**/go.mod' '**/go.sum'
          git commit \
            -m "build(deps): go mod tidy across modules" \
            -m "Sync nested modules (replace => ../../) after a Dependabot dependency bump so their go.mod/go.sum match the root. Generated by the dependabot-auto-tidy workflow."
          git push origin "HEAD:$HEAD_REF"
