name: scorecard

# OpenSSF Scorecard supply-chain audit. Publishes a public score
# (https://securityscorecards.dev/viewer/) and uploads the SARIF
# report to GitHub's code-scanning UI. Weekly cadence is the
# Scorecard project's recommended default.

on:
  branch_protection_rule:
  schedule:
    - cron: "37 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: run scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: upload sarif to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
