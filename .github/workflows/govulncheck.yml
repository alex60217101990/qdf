name: govulncheck

# Go vulnerability scanner. Runs daily on schedule + on push to main
# so a CVE filed against a transitive dependency surfaces within 24 h.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: scan (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            working-directory: .
          - module: bench
            working-directory: bench
          - module: qdfgen
            working-directory: cmd/qdfgen
          - module: qdf-bench
            working-directory: cmd/qdf-bench
          - module: codegen_test
            working-directory: internal/codegen_test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            bench/go.sum
            cmd/qdfgen/go.sum
            cmd/qdf-bench/go.sum
            internal/codegen_test/go.sum

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: scan ${{ matrix.module }}
        working-directory: ${{ matrix.working-directory }}
        run: govulncheck ./...
