name: qdf-bench-matrix

# Runs the cmd/qdf-bench representative perf matrix over the real adalanche
# sample data, under every qdf build-tag combination (run.sh), and uploads the
# full output as an artifact. Manual only: it downloads the sample data, builds
# one binary per tag combo, and runs the whole matrix — minutes of work, and
# shared-runner timings are noisy, so this is a reference dump on demand, not a
# regression gate (see bench-trend.yml for the gated micro-benchmarks).

on:
  workflow_dispatch:
    inputs:
      iters:
        description: "iterations per measured op (higher = stabler ratios, slower)"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: qdf-bench-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-matrix:
    name: qdf-bench-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/go-build
          key: gocache-qdfbench-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/*.go') }}
          restore-keys: |
            gocache-qdfbench-${{ runner.os }}-

      - name: Run the full build-tag matrix (downloads sample data itself)
        env:
          # qdf_simd builds use the experimental simd package; harmless for the
          # other combos. run.sh builds one binary per tag combination.
          GOEXPERIMENT: simd
        run: |
          set -euo pipefail
          {
            echo "qdf-bench matrix — commit ${GITHUB_SHA} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "go: $(go version)"
            echo
            ./cmd/qdf-bench/run.sh -iters "${{ inputs.iters }}"
          } 2>&1 | tee qdf-bench-matrix.txt

      - name: Upload benchmark output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qdf-bench-matrix-${{ github.sha }}
          path: qdf-bench-matrix.txt
          retention-days: 30
