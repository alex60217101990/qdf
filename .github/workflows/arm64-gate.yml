name: arm64-gate

# TEMPORARY branch-scoped perf gate for the arm64 NEON work. Removed before the
# PR (a permanent arm64 lane is added to ci.yml instead). Runs only on pushes
# to perf/arm64-neon, so no other CI runners are spent during iteration.
on:
  push:
    branches: [perf/arm64-neon]

permissions:
  contents: read

concurrency:
  group: arm64-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: arch + go
        run: |
          uname -m
          go version

      - name: parity (qdf_simd, native arm64)
        run: go test -tags qdf_simd -count=1 -run 'TestUnpack|TestPack' .

      - name: bench NEON vs scalar
        run: |
          set -euo pipefail
          go test -tags qdf_simd -run=^$ -bench='BenchmarkUnpack' -benchtime=300ms -count=6 . | tee /tmp/neon.txt
          go test            -run=^$ -bench='BenchmarkUnpack' -benchtime=300ms -count=6 . | tee /tmp/scalar.txt
          echo '==== NEON (qdf_simd) ===='; grep Unpack /tmp/neon.txt
          echo '==== scalar (default) ===='; grep Unpack /tmp/scalar.txt
