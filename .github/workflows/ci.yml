name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref. Saves CI minutes on PR rebases.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GOEXPERIMENT=simd unlocks the qdf_simd build tag on amd64.
  GOEXPERIMENT: simd

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm gives a native arm64 lane so the qdf_simd NEON
        # kernels are tested on real hardware (macos-latest is also arm64,
        # but this is the canonical Linux arm64 runner).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            bench/go.sum
            cmd/qdfgen/go.sum
            cmd/qdf-bench/go.sum
            internal/codegen_test/go.sum

      # Cache the Go build cache separately. setup-go already caches the
      # module download cache (~/go/pkg/mod), but the build cache makes
      # the biggest difference on incremental runs.
      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: gocache-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum', '**/*.go') }}
          restore-keys: |
            gocache-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - name: go env
        run: |
          go version
          go env GOMODCACHE GOCACHE

      # Warm every module's download cache with retries up front. A Dependabot
      # bump misses setup-go's go.sum-keyed cache, so the first build/test would
      # fetch the new module mid-step where a transient proxy.golang.org stream
      # error fails the job with no retry. Pre-downloading here absorbs that flake.
      - name: Warm module cache (all modules, retry transient errors)
        run: |
          for dir in . bench cmd/qdfgen cmd/qdf-bench internal/codegen_test; do
            ok=
            for i in 1 2 3 4 5; do
              if ( cd "$dir" && go mod download ); then ok=1; break; fi
              echo "go mod download in $dir failed (attempt $i/5); retrying in $((i * 5))s"
              sleep $((i * 5))
            done
            if [ -z "$ok" ]; then
              echo "::error::go mod download in $dir failed after 5 attempts"
              exit 1
            fi
          done

      - name: vet
        run: go vet ./...

      - name: test (default, -race, -coverprofile)
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.out
          flags: unittests-${{ matrix.os }}
          fail_ci_if_error: false

      - name: test (-tags qdf_reflect2, -race)
        run: go test -tags qdf_reflect2 -race -count=1 -timeout=10m ./...

      - name: test (-tags qdf_simd, -race)
        run: go test -tags qdf_simd -race -count=1 -timeout=10m ./...

      - name: test (-tags qdf_reflect2 qdf_simd, -race)
        run: go test -tags 'qdf_reflect2 qdf_simd' -race -count=1 -timeout=10m ./...

      - name: build qdfgen
        working-directory: cmd/qdfgen
        run: go build ./...

      - name: build qdf-bench
        working-directory: cmd/qdf-bench
        run: |
          # Its own module (msgpack baseline lives here, not in the qdf library).
          # Build + vet only; the full data-driven matrix runs in qdf-bench-matrix.yml.
          go build .
          go vet .

      - name: codegen test (two-phase)
        working-directory: internal/codegen_test
        run: |
          # First phase emits sample_qdf.go; second phase exercises the
          # generated methods. Both phases must pass.
          go test -run TestGenerate -count=1 .
          go test -race -count=1 -timeout=10m .

      - name: TestSizes (bench module, no benchmarks)
        working-directory: bench
        run: go test -run TestSizes -count=1 -timeout=2m .

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: root
            working-directory: .
          - module: bench
            working-directory: bench
          - module: qdfgen
            working-directory: cmd/qdfgen
          - module: qdf-bench
            working-directory: cmd/qdf-bench
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            bench/go.sum
            cmd/qdfgen/go.sum
            cmd/qdf-bench/go.sum
            internal/codegen_test/go.sum

      # Warm the module download cache with retries BEFORE golangci-lint.
      # On a Dependabot bump the go.sum changes, so setup-go's cache misses and
      # golangci-lint downloads the new module on the fly during typecheck — where
      # a transient proxy.golang.org stream error ("INTERNAL_ERROR; received from
      # peer") fails the whole lint with no retry. Pre-downloading here with a
      # retry loop makes that fetch resilient; golangci-lint then reuses the warm
      # GOMODCACHE and never touches the network.
      - name: Warm module cache (retry transient proxy errors)
        working-directory: ${{ matrix.working-directory }}
        run: |
          for i in 1 2 3 4 5; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $i/5); retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "::error::go mod download failed after 5 attempts (transient proxy/network)"
          exit 1

      - name: golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: latest
          working-directory: ${{ matrix.working-directory }}
          # The action caches its own analysis layer keyed on go.sum hash.
          args: --timeout=5m

  fuzz-smoke:
    name: fuzz (30s smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/go-build
          key: gocache-fuzz-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum', '**/*.go') }}
          restore-keys: |
            gocache-fuzz-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      # Persist the fuzz corpus between runs so newly discovered inputs
      # accumulate across CI builds. Restore is best-effort.
      - name: Restore fuzz corpus
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: testdata/fuzz
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-

      # GOMEMLIMIT caps per-worker RSS so the runtime GCs instead of being
      # OOM-killed under cumulative fuzz memory growth (avoids the flaky
      # "hung or terminated unexpectedly" environmental failure).
      - name: FuzzDecoder_NeverPanics (30s)
        env:
          GOMEMLIMIT: 2GiB
        run: go test -run=^$ -fuzz=FuzzDecoder_NeverPanics -fuzztime=30s -timeout=2m -parallel=2

      - name: FuzzRoundTrip_StringSlice (30s)
        env:
          GOMEMLIMIT: 2GiB
        run: go test -run=^$ -fuzz=FuzzRoundTrip_StringSlice -fuzztime=30s -timeout=2m -parallel=2

      # Re-run the seed + persisted corpus as a regression check.
      - name: Fuzz corpus regression
        run: go test -run='Fuzz' -count=1 -timeout=2m

  # Verifies the committed protobuf/flatbuffers competitor code (bench/pb,
  # bench/fbs) is up to date with the .proto/.fbs schemas. The generated code
  # is committed so normal CI/build needs no protoc/flatc; this is the only job
  # that installs them, with the binaries cached between runs. Tool versions
  # are pinned to match bench/codegen.go — a mismatch yields spurious diffs.
  codegen-drift:
    name: codegen drift (protobuf/flatbuffers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: bench/go.sum

      - name: Cache protoc + flatc binaries
        id: codegen-tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.codegen-tools/bin
          key: codegen-tools-protoc34.1-flatc25.12.19

      - name: Install protoc + flatc (cache miss only)
        if: steps.codegen-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.codegen-tools/bin
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-linux-x86_64.zip
          unzip -o /tmp/protoc.zip -d /tmp/protoc
          install -m 0755 /tmp/protoc/bin/protoc ~/.codegen-tools/bin/protoc
          # flatc v25.12.19 Linux release; adjust the asset name if it 404s.
          curl -fsSL -o /tmp/flatc.zip \
            https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g++-13.zip
          unzip -o /tmp/flatc.zip -d ~/.codegen-tools/bin
          chmod +x ~/.codegen-tools/bin/flatc

      - name: Install protoc-gen-go (pinned)
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Regenerate and verify no drift
        working-directory: bench
        run: |
          set -euo pipefail
          export PATH="$HOME/.codegen-tools/bin:$(go env GOPATH)/bin:$PATH"
          protoc --go_out=. --go_opt=paths=source_relative pb/bench.proto
          flatc --go --gen-onefile -o fbs fbs/bench.fbs
          sed -i.bak 's/^package[[:space:]]*$/package benchfbs/' fbs/bench_generated.go
          rm -f fbs/bench_generated.go.bak
          if ! git diff --quiet -- pb fbs; then
            echo "::error::Generated protobuf/flatbuffers code is stale — run 'go generate ./...' in bench/ (see bench/codegen.go) and commit."
            git --no-pager diff -- pb fbs
            exit 1
          fi
